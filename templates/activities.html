{% extends "base.html" %}
{% block title %}Activities — plentyfish.ai{% endblock %}
{% block content %}
<div style="padding: 16px 24px 0;">
  <h1 class="md-title-large" style="margin:0;">Activities</h1>
</div>
<section style="padding: 8px 24px 24px;">
  <h2 style="font-size:15px; border-bottom:1px solid var(--line); padding-bottom:8px;">
    Activities
  </h2>
  <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:10px; margin-top:12px;">
    {% for a in activities %}
    <div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;">
      <div style="font-size:13px; font-weight:600;">{{ a[0] }}</div>
      <div style="color:var(--accent); font-size:11px; margin-top:2px;">{{ a[1] }}</div>
      <div style="color:var(--dim); font-size:11px; margin-top:4px; line-height:1.4;">{{ a[2] }}</div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
